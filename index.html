<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoSave - Video Tools</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:32px 20px;
}

.logo{
  font-size:38px;
  font-weight:bold;
}

header p{
  margin-top:8px;
  color:#cbd5e1;
}

.container{
  max-width:700px;
  margin:45px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:22px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.card h2{
  font-size:30px;
  margin-bottom:10px;
}

.subtitle{
  color:#64748b;
  margin-bottom:25px;
}

.input-box{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

input{
  flex:1;
  padding:16px;
  border:2px solid #e2e8f0;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

.paste{
  padding:0 16px;
  border:0;
  border-radius:12px;
  background:#e2e8f0;
  cursor:pointer;
  font-weight:bold;
}

.continue{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.continue:hover{
  background:#1d4ed8;
}

.platforms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}

.platform{
  padding:17px;
  background:#f1f5f9;
  border-radius:12px;
  font-size:16px;
}

.notice{
  margin-top:25px;
  font-size:13px;
  color:#64748b;
  line-height:1.5;
}

footer{
  text-align:center;
  padding:30px;
  color:#64748b;
}

#message{
  margin-top:15px;
  font-size:14px;
  font-weight:bold;
}

@media(max-width:600px){

  .input-box{
    flex-direction:column;
  }

  .paste{
    padding:14px;
  }

  .card h2{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🎬 VideoSave</div>
  <p>Simple video tools in one place</p>
</header>

<div class="container">

<div class="card">

<h2>Save Your Video</h2>

<p class="subtitle">
Paste a video link to get started
</p>

<div class="input-box">

<input
id="videoURL"
type="url"
placeholder="Paste video URL here..."
>

<button class="paste" onclick="pasteURL()">
📋 Paste
</button>

</div>

<button class="continue" onclick="checkURL()">
🔗 Continue
</button>

<div id="message"></div>

<div class="platforms">

<div class="platform">▶️ YouTube</div>
<div class="platform">🎵 TikTok</div>
<div class="platform">📘 Facebook</div>
<div class="platform">📸 Instagram</div>

</div>

<div class="notice">
Download only videos that you own or have permission to use.
Please respect copyright and platform terms.
</div>

</div>
</div>

<footer>
© 2026 VideoSave
</footer>

<script>

async function checkURL() {
  const url = document.getElementById("videoURL").value.trim();
  const message = document.getElementById("message");

  if (!url) {
    message.innerText = "⚠️ Please enter a video URL.";
    return;
  }

  try {
    new URL(url);
  } catch {
    message.innerText = "❌ Please enter a valid URL.";
    return;
  }

  message.innerText = "⏳ Connecting to VideoSave...";

  const api =
    "https://videosave-abi.hhtc02304.workers.dev/api?url=" +
    encodeURIComponent(url);

  try {
    const response = await fetch(api, {
      redirect: "manual"
    });

    if (response.type === "opaqueredirect") {
      message.innerText = "✅ Your link was received.";
    } else {
      message.innerText = "✅ VideoSave backend is connected.";
    }

  } catch (error) {
    message.innerText =
      "❌ Could not connect to the backend.";
  }
}
  }

}

</script>

</body>
</html>
